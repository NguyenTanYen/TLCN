# Giai đoạn 2: HTTPS (Nginx làm web server + reverse proxy). IP_CONG_KHAI được thay bằng IP thật bởi bat_https.sh
server {
    listen 80;
    server_name app.IP_CONG_KHAI.sslip.io lms.IP_CONG_KHAI.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# Hệ thống phân tích CĐR (FastAPI, cổng 8000 trong mạng Docker)
server {
    listen 443 ssl;
    http2 on;
    server_name app.IP_CONG_KHAI.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/app.IP_CONG_KHAI.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.IP_CONG_KHAI.sslip.io/privkey.pem;
    client_max_body_size 64m;                      # tải ảnh phiếu / PDF đã quét
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# Moodle
server {
    listen 443 ssl;
    http2 on;
    server_name lms.IP_CONG_KHAI.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/lms.IP_CONG_KHAI.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lms.IP_CONG_KHAI.sslip.io/privkey.pem;
    client_max_body_size 256m;
    location / {
        proxy_pass http://moodle:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
