# Giai đoạn 1: chỉ HTTP (dùng để lấy chứng chỉ Let's Encrypt). Sau khi chạy ./bat_https.sh sẽ chuyển sang https.conf
server {
    listen 80;
    server_name app.IP_CONG_KHAI.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { proxy_pass http://app:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
server {
    listen 80;
    server_name lms.IP_CONG_KHAI.sslip.io;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { proxy_pass http://moodle:80; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
}
